[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-qwen-asr"
version = "0.1.0"
description = "Local CUDA transcription of audio and video with Qwen3-ASR"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.10.0",
    "transformers==5.20.2",
    "accelerate>=1.12,<2",
    "numpy>=2,<3",
    "librosa>=0.11,<0.12",
    "soundfile>=0.13,<0.14",
]

[project.scripts]
qwen-asr = "qwen_asr_cli.cli:main"

[project.optional-dependencies]
flash = ["kernels==0.17.2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_asr_cli"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
